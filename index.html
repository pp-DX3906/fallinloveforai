<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FallinloveforAI · SleepWalking</title>
  <meta name="description" content="SleepWalking —— 三场可以进入的交互梦境。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b67d8'/%3E%3Cpath d='M16 5l2.8 6.4 7 .7-5.3 4.6 1.6 6.8-6.1-3.6-6.1 3.6 1.6-6.8-5.3-4.6 7-.7z' fill='%23fff6df'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dream-cover">
    <div class="aurora" aria-hidden="true"></div>
    <canvas id="stars" aria-hidden="true"></canvas>

    <header class="topbar">
      <a class="brand" href="./" aria-label="返回封面">
        <strong>FallinloveforAI</strong>
        <span>交互梦境展 · 2026</span>
      </a>
      <span class="edition">THREE DREAMS / ONE NIGHT</span>
    </header>

    <img class="sleepwalking" src="assets/sleepwalking.png" alt="SleepWalking">

    <a class="dream-object bed-link" href="works/homer-dreams-webgl/index.html" aria-label="点击床进入 Dream Orbit：漂浮梦境">
      <img src="assets/bed.png" alt="一张黄色的梦中床">
      <span class="object-label"><b>02</b> DREAM ORBIT</span>
    </a>

    <a class="dream-object pillow-link" href="works/bedvortex/index.html" aria-label="点击枕头进入 Bed Vortex：床与漩涡">
      <img src="assets/pillow.png" alt="白色枕头">
      <span class="object-label"><b>01</b> BED VORTEX</span>
    </a>

    <a class="dream-object sheep-link" href="works/pengpai-dream-scene/index.html" aria-label="进入 Drifting Sleep：火焰云海">
      <img src="assets/sheep.png" alt="白色小羊">
      <span class="object-label"><b>03</b> DRIFTING SLEEP</span>
    </a>

    <img class="decor cloud" src="assets/cloud.png" alt="">
    <img class="decor moon" src="assets/moon.png" alt="">

    <div class="star-field" aria-hidden="true">
      <img class="picture-star star-1" src="assets/star-glitter.png" alt="">
      <img class="picture-star star-2" src="assets/star-silver.png" alt="">
      <img class="picture-star star-3" src="assets/star-pink.png" alt="">
      <img class="picture-star star-4" src="assets/star-glitter.png" alt="">
      <img class="picture-star star-5" src="assets/star-silver.png" alt="">
      <img class="picture-star star-6" src="assets/star-pink.png" alt="">
      <img class="picture-star star-7" src="assets/star-glitter.png" alt="">
      <img class="picture-star star-8" src="assets/star-mint.png" alt="">
      <img class="picture-star star-9" src="assets/star-opal.png" alt="">
      <img class="picture-star star-10" src="assets/star-confetti.png" alt="">
      <img class="picture-star star-11" src="assets/star-blush.png" alt="">
      <img class="picture-star star-12" src="assets/star-yellow.png" alt="">
      <img class="picture-star star-13" src="assets/star-mint.png" alt="">
      <img class="picture-star star-14" src="assets/star-opal.png" alt="">
      <img class="picture-star star-15" src="assets/star-confetti.png" alt="">
      <img class="picture-star star-16" src="assets/star-blush.png" alt="">
      <img class="picture-star star-17" src="assets/star-yellow.png" alt="">
    </div>

    <div class="planet" aria-hidden="true">
      <span class="planet-glow"></span>
      <span class="planet-ring ring-one"></span>
      <span class="planet-ring ring-two"></span>
    </div>

    <p class="hint">点击床、枕头或小羊，进入三场梦境</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
