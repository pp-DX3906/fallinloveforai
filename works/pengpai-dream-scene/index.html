<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澎湃睡觉 · 梦境场景（公开演示版）</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 10px; bottom: 8px;
    color: #b9c3e8; font: 12px/1.5 Menlo, Consolas, monospace;
    text-shadow: 0 1px 2px #000; user-select: none; pointer-events: none;
  }
  #err {
    position: fixed; left: 10px; top: 8px; max-width: 90vw;
    color: #ff7070; font: 12px/1.5 Menlo, Consolas, monospace;
    white-space: pre-wrap; text-shadow: 0 1px 2px #000; pointer-events: none;
  }
  #panelToggle {
    position: fixed; right: 10px; top: 10px; z-index: 10;
    background: rgba(8,12,28,0.72); color: #cdd6f4;
    border: 1px solid rgba(150,170,255,0.35); border-radius: 8px;
    font: 12px Menlo, Consolas, monospace; padding: 5px 10px; cursor: pointer;
  }
  #panelToggle:hover { background: rgba(30,40,80,0.8); }
  #panel {
    position: fixed; right: 10px; top: 42px; width: 250px;
    max-height: calc(100vh - 60px); overflow-y: auto; z-index: 10;
    background: rgba(8,12,28,0.78); border: 1px solid rgba(150,170,255,0.25);
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px);
  }
  #panel .group { margin: 9px 0 3px; color: #9db8ff; font-weight: bold; }
  #panel .group:first-child { margin-top: 0; }
  #panel .row { display: flex; align-items: center; gap: 6px; margin: 5px 0;
    color: #cdd6f4; font: 11px Menlo, Consolas, monospace; }
  #panel .row label { flex: 0 0 66px; }
  #panel .row input[type=range] { flex: 1; accent-color: #ff8ab0; height: 14px; }
  #panel .row .val { flex: 0 0 36px; text-align: right; color: #9db8b8; }
  #resetBtn {
    margin-top: 10px; width: 100%; padding: 4px 0; cursor: pointer;
    background: rgba(150,170,255,0.15); color: #cdd6f4;
    border: 1px solid rgba(150,170,255,0.35); border-radius: 6px;
    font: 11px Menlo, Consolas, monospace;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="err"></div>
<button id="panelToggle">⚙ 参数</button>
<div id="panel"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ============================================================================
// 澎湃睡觉 · 梦境场景（公开演示版）
// ----------------------------------------------------------------------------
// 体积火焰为**原创占位实现**：视觉原型向 Inigo Quilez 的 Shadertoy 经典作品
// 「Flames」致敬 —— https://www.shadertoy.com/view/MsXGRf
// （原作代码版权较严，未随本仓库分发；本文件不含任何原作代码。）
//
// 管线：① 星空背景 + PBR 床渲染到离屏纹理 → ② 体积火焰全屏叠加，
// 火焰的背景色采样通道一画面，形成自然的缠绕与遮挡关系。
// ============================================================================

const flameVert = /* glsl */`
out vec2 vUv;
void main() {
  vUv = position.xy * 0.5 + 0.5;
  gl_Position = vec4(position.xy, 0.0, 1.0);
}`;

const flameFrag = /* glsl */`
uniform sampler2D uScene;   // 底层画面：星空背景 + 白床
out vec4 outColor;
uniform vec3  iResolution;
uniform float iTime;
uniform float uMoX;        // 视角方位分量：拖拽后保持
uniform float uCamY;       // 垂直拖拽带来的相机升降
uniform float uAlpha;      // 火焰浓淡
uniform float uChurn;      // 翻涌速度
uniform float uCorridor;   // 走廊薄纱密度
uniform float uPocket;     // 床周围口袋挖空强度
uniform float uPart;       // 拖拽拨开火焰 0..1（交互驱动）
uniform float uHueShift;   // 色相偏移（半圈）
uniform float uBright;     // 画面整体亮度

// —— 火焰色卡（深红系，线性空间）——
const vec3 FLAME_DEEP  = vec3(0.10, 0.010, 0.018); // 暗红（稀薄边缘）
const vec3 FLAME_RED   = vec3(0.42, 0.035, 0.045); // 深红（云海主体）
const vec3 FLAME_EMBER = vec3(0.85, 0.22, 0.060);  // 余烬橙红（高密度核心）
const vec3 FLAME_WINE  = vec3(0.20, 0.015, 0.030); // 酒红（低处深处）

float vhash(vec3 p){
  return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123);
}
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(vhash(i + vec3(0,0,0)), vhash(i + vec3(1,0,0)), f.x),
        mix(vhash(i + vec3(0,1,0)), vhash(i + vec3(1,1,0)), f.x), f.y),
    mix(mix(vhash(i + vec3(0,0,1)), vhash(i + vec3(1,0,1)), f.x),
        mix(vhash(i + vec3(0,1,1)), vhash(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++){
    s += a * vnoise(p);
    p = p * 2.03 + vec3(1.7, -0.6, 0.9);
    a *= 0.5;
  }
  return s;
}
vec3 hueShift(vec3 c, float h){
  const vec3 k = vec3(0.57735);
  float ca = cos(h * 6.2831853);
  return c*ca + cross(k, c)*sin(h * 6.2831853) + k*dot(k, c)*(1.0 - ca);
}

float fbm3(vec3 p){
  float s = 0.0, a = 0.5;
  for (int i = 0; i < 3; i++){
    s += a * vnoise(p);
    p = p * 2.03 + vec3(1.7, -0.6, 0.9);
    a *= 0.5;
  }
  return s;
}
// 向上翻涌的湍流火焰海：双层噪声叠加翻滚更剧烈，海平面抬高让火焰铺满画面（原创密度场）
float flameDensity(vec3 p, float gt){
  vec3 q = vec3(p.x, p.y - gt * 0.95, p.z);
  float n = fbm(q * 1.25);
  n += 0.34 * fbm3(q * 2.7 + vec3(0.0, -gt * 1.5, gt * 0.35)); // 快速上冒的细节层
  n *= 0.76;
  float level = 1.35 + 1.45 * (n - 0.5);                // 抬高的海平面
  float sea  = smoothstep(level + 0.65, level - 0.55, p.y);
  float fade = smoothstep(-1.6, -0.4, p.y);
  return clamp(sea * (0.35 + 0.65 * n) * 1.35 * fade, 0.0, 1.0);
}

vec4 map(vec3 p, vec3 ro, float gt){
  vec3 r = p;
  vec3 pb = vec3(0.0, 0.5, 0.0);
  float den = flameDensity(p, gt);

  // 不规则调制噪声：让挖空边缘参差起伏，而不是规整的圆
  float wobP = vnoise(r * 1.35 + vec3(0.0, -gt * 0.55, 3.1));

  // 床周围口袋：静止时轻微（半透出床轮廓），拖拽时增强并随噪声抖动
  float pk = mix(0.30, uPocket, uPart) * (0.35 + 0.85 * wobP);
  den *= 1.0 - pk * (1.0 - smoothstep(1.6, 2.9, length(r - pb)));

  // 视线走廊 + 拨开：静止时几乎不挖（火焰铺满画面），拖拽时向两旁不规则分开
  vec3 ab = pb - ro;
  float th = clamp(dot(r - ro, ab) / dot(ab, ab), 0.0, 1.0);
  float dLine = length(r - (ro + th * ab));
  float cFloor = mix(0.55, 0.02, uPart);
  float ang = atan(r.z - pb.z, r.x - pb.x);
  float wobA = vnoise(vec3(cos(ang) * 1.7, sin(ang) * 1.7, (r.y - gt * 0.8) * 0.55)
              + vec3(0.0, 0.0, gt * 0.30));
  float cR = mix(0.45, 2.00, uPart) * (0.45 + 0.75 * wobA); // 挖空半径随角度/高度起伏
  den *= cFloor + (1.0 - cFloor) * smoothstep(cR - 0.7, cR + 0.25, dLine);
  float dSide = (dLine - cR - 0.25) / 0.5;
  den += uPart * 0.50 * (0.3 + 0.9 * wobP) * exp(-dSide * dSide); // 分开的火舌边缘参差
  den = clamp(den, 0.0, 1.0);

  vec3 col = mix(FLAME_DEEP, FLAME_RED, den);
  col = mix(col, FLAME_EMBER, smoothstep(0.72, 1.0, den));
  col += 0.05 * sin(0.6 * p.yzx + gt);
  col = mix(FLAME_WINE, col, clamp((r.y + 0.6) / 1.9, 0.0, 1.0));
  return vec4(col, den);
}

vec3 marchFlames(vec3 ro, vec3 rd, vec3 bg, float gt){
  vec4 acc = vec4(0.0);
  float dith = fract(52.9829189 * fract(0.06711056 * gl_FragCoord.x + 0.00583715 * gl_FragCoord.y));
  float t = 0.06 * dith;
  for (int i = 0; i < 80; i++){
    if (acc.a > 0.99) break;
    vec4 s = map(ro + t * rd, ro, gt);
    s.a *= uAlpha;
    s.rgb = mix(bg, s.rgb, exp(-0.0015 * t * t)) * s.a;
    acc += s * (1.0 - acc.a);
    t += 0.06;
  }
  // 火焰保持轻微通透（×0.90）：浓处也隐约透出背景与床的轮廓
  return mix(bg, acc.rgb / max(acc.a, 0.001), acc.a * 0.90);
}

void main(){
  vec2 q = gl_FragCoord.xy / iResolution.xy;
  vec2 p = (-1.0 + 2.0 * q) * vec2(iResolution.x / iResolution.y, 1.0);

  // 相机：环绕 + 可升降（与 JS 侧 syncCamera 完全同步）
  float an = -0.07 * iTime + 3.0 * uMoX;
  vec3 ro = vec3(cos(an) * 4.2, 2.4 + uCamY, sin(an) * 4.2);
  vec3 ta = vec3(0.0, 0.4, 0.0);
  vec3 ww = normalize(ta - ro);
  vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), ww));
  vec3 vv = cross(ww, uu);
  vec3 rd = normalize(p.x * uu + p.y * vv + 2.2 * ww);

  vec3 bg = texture(uScene, q).rgb;

  vec3 col = marchFlames(ro, rd, bg, iTime * uChurn);

  // 暗角 + 亮度 + 色相 + 伽马
  float vig = smoothstep(1.4, 0.45, length(q - 0.5) * 1.35);
  col *= 0.55 + 0.45 * vig;
  col *= uBright;
  col = hueShift(col, uHueShift);
  col = clamp(col, 0.0, 1.0);
  outColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

// 背景图 cover-fit 全屏着色
const bgVert = flameVert;
const bgFrag = /* glsl */`
in vec2 vUv;
out vec4 outColor;
uniform sampler2D uBg;
uniform vec2 uRes;
uniform float uImgAspect;
uniform float uBrightExp;  // 亮度（伽马）
uniform float uBlueMul;    // 蓝调倍率
uniform float uBlueAdd;    // 深蓝底
void main() {
  vec2 uv = vUv - 0.5;
  float sa = uRes.x / uRes.y;
  if (sa > uImgAspect) uv.y *= uImgAspect / sa; else uv.x *= sa / uImgAspect;
  vec3 c = texture(uBg, uv + 0.5).rgb;
  c = pow(c, vec3(uBrightExp));      // 压暗：值越大画面越深（>1 为夜间压暗）
  // 黑蓝夜色：按亮度约束色相，强压红绿、提蓝
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  c = mix(vec3(lum), c, 0.40) * vec3(0.42, 0.64, uBlueMul);
  c += vec3(0.003, 0.008, uBlueAdd); // 极低深蓝底，保住夜晚感
  outColor = vec4(c, 1.0);
}`;

const canvas = document.getElementById('c');
const hud = document.getElementById('hud');
const errBox = document.getElementById('err');
const fail = (msg) => { errBox.textContent += msg + '\n'; };
window.addEventListener('error', e => fail('JS错误: ' + e.message));
window.addEventListener('unhandledrejection', e => fail('Promise错误: ' + e.reason));
canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); fail('WebGL上下文丢失'); });
canvas.addEventListener('webglcontextrestored', () => fail('WebGL上下文已恢复'));
window.__dbg = { frames: 0, lastErr: '', console: [], ready: false };
{
  const origErr = console.error.bind(console);
  console.error = (...a) => {
    window.__dbg.console.push(a.map(x => (typeof x === 'string' ? x : String(x))).join(' ').slice(0, 400));
    origErr(...a);
  };
}

let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, powerPreference: 'high-performance', preserveDrawingBuffer: true });
} catch (e) {
  fail('错误：无法创建 WebGL2 上下文。' + e.message);
  throw e;
}
renderer.outputColorSpace = THREE.LinearSRGBColorSpace; // 最终编码由火焰着色器手动完成
renderer.setClearColor(0x000000, 1);

const sceneBase = new THREE.Scene();   // 通道一：星空背景 + 床
const flameScene = new THREE.Scene();  // 通道二：体积火焰
const dummyCam = new THREE.Camera();
const cam = new THREE.PerspectiveCamera(THREE.MathUtils.radToDeg(2 * Math.atan(1 / 2.2)), 1, 0.1, 100);

// ---- 全屏三角形 ----
const triGeo = new THREE.BufferGeometry();
triGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-1,-1,0, 3,-1,0, -1,3,0]), 3));

// ---- 通道一：背景图（cover-fit） ----
const BG_IMG_W = 833, BG_IMG_H = 941;
const bgTex = new THREE.TextureLoader().load('assets/bg.png', undefined, undefined,
  (e) => fail('背景图加载失败：' + e));
bgTex.colorSpace = THREE.SRGBColorSpace;
const bgMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  uniforms: {
    uBg: { value: bgTex },
    uRes: { value: new THREE.Vector2(1, 1) },
    uImgAspect: { value: BG_IMG_W / BG_IMG_H },
    uBrightExp: { value: 0.95 },
    uBlueMul: { value: 1.55 },
    uBlueAdd: { value: 0.018 },
  },
  vertexShader: bgVert, fragmentShader: bgFrag,
  depthTest: false, depthWrite: false,
});
const bgQuad = new THREE.Mesh(triGeo, bgMat);
bgQuad.renderOrder = -10;
bgQuad.frustumCulled = false;
sceneBase.add(bgQuad);

// ---- 通道一：灯光（色卡：暖光 + 靛蓝夜空环境光） ----
// r160 物理光照点光按距离平方衰减，强度按衰减补偿保证床面受光充足
sceneBase.add(new THREE.AmbientLight(0xbfd0ff, 1.6));
sceneBase.add(new THREE.HemisphereLight(0x35418f, 0xffc9b8, 1.8));
const warm = new THREE.PointLight(0xffc9ad, 22, 0, 2);
warm.position.set(0.4, -0.3, 3.2);
sceneBase.add(warm);
const cool = new THREE.DirectionalLight(0x93b4ff, 3.5);
cool.position.set(-2.5, 4, -1.5);
sceneBase.add(cool);

// ---- 通道一：床模型 ----
let bedPivot = null; // 床的翻转支点，加载完成后赋值
let bedWrapRef = null; // 床的缩放包装层
const pillows = []; // 枕头网格列表，供点击漂浮交互

const raycaster = new THREE.Raycaster();
const ndcV = new THREE.Vector2();
function pickPillow(cx, cy) {
  if (!pillows.length) return null;
  const rect = canvas.getBoundingClientRect();
  ndcV.x = ((cx - rect.left) / rect.width) * 2 - 1;
  ndcV.y = -((cy - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(ndcV, cam);
  const hits = raycaster.intersectObjects(pillows, false);
  return hits.length ? hits[0].object : null;
}

new GLTFLoader().load('assets/newbed.glb',
  (gltf) => {
    const bed = gltf.scene;
    bed.rotation.x = -Math.PI / 2; // 模型原始朝向沿 +Y 站立：放倒 90° 使床面朝上
    const box = new THREE.Box3().setFromObject(bed);
    const size = box.getSize(new THREE.Vector3());
    const s = 1.75 / Math.max(size.x, size.y, size.z);
    bed.scale.setScalar(s);
    box.setFromObject(bed);
    const center = box.getCenter(new THREE.Vector3());
    // 以床的包围盒中心为支点挂到 pivot 上，便于做不规则翻转
    bed.position.x -= center.x;
    bed.position.y -= center.y;
    bed.position.z -= center.z;
    const pivot = new THREE.Group();
    pivot.position.set(0, 0.15, 0);
    const bedWrap = new THREE.Group();
    bedWrap.scale.setScalar(FX.bedSize);
    bedWrap.add(bed);
    pivot.add(bedWrap);
    sceneBase.add(pivot);
    bedPivot = pivot;
    bedWrapRef = bedWrap;
    // 收集枕头网格：点击漂浮交互（排除装饰件，只保留真实枕头）
    pillows.length = 0;
    bed.traverse(o => {
      const n = (o.name || '').toLowerCase();
      if (o.isMesh && n.includes('pillow') && !n.includes('silhouette') && !n.includes('seam')) {
        o.userData.origPos = o.position.clone();
        o.userData.floating = false;
        o.userData.floatT = 0;
        o.userData.phase = Math.random() * 6.28;
        pillows.push(o);
      }
    });
  },
  undefined,
  (e) => fail('床模型加载失败：' + e));

// ---- 通道二：火焰 ----
const rt = new THREE.WebGLRenderTarget(2, 2, { depthBuffer: true });
const flameMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3,
  uniforms: {
    iResolution: { value: new THREE.Vector3(1, 1, 1) },
    iTime: { value: 0 },
    uScene: { value: rt.texture },
    uMoX: { value: 0 },
    uCamY: { value: 0 },
    uAlpha: { value: 0.40 },
    uChurn: { value: 2.0 },
    uCorridor: { value: 0.04 },
    uPocket: { value: 0.40 },
    uPart: { value: 0 },
    uHueShift: { value: 0 },
    uBright: { value: 1.25 },
  },
  vertexShader: flameVert, fragmentShader: flameFrag,
  depthTest: false, depthWrite: false,
});
const flameTri = new THREE.Mesh(triGeo, flameMat);
flameTri.frustumCulled = false;
flameScene.add(flameTri);

// ---- 交互：拖拽调整视角（松手保持角度，缓慢漂移继续）；单击枕头漂浮 / 单击火焰换色相 ----
let dragging = false;
let downCX = 0, downCY = 0, lastCY = 0;
let camY = 1.4;      // 垂直拖拽的相机升降量（默认略抬高俯瞰平放的床）
let viewMoX = 0;   // 拖拽后的视角方位分量（0..1，松手保持）
let part = 0;      // 火焰拨开程度（拖拽时→1，松手缓慢回落）
window.__getPart = () => part;
window.__getPivot = () => bedPivot ? {rx:+bedPivot.rotation.x.toFixed(3), ry:+bedPivot.rotation.y.toFixed(3), rz:+bedPivot.rotation.z.toFixed(3), y:+bedPivot.position.y.toFixed(2)} : null;
canvas.addEventListener('pointerdown', e => {
  dragging = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  downCX = e.clientX; downCY = e.clientY; lastCY = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  viewMoX = Math.min(1, Math.max(0, e.clientX / canvas.clientWidth));
  camY = Math.min(1.2, Math.max(-0.6, camY - (e.clientY - lastCY) * 0.006)); // 上拖升高、下拖降低
  lastCY = e.clientY;
});
canvas.addEventListener('pointerup', e => {
  dragging = false;
  // 单击（几乎未移动）：命中枕头→切换漂浮；否则→色相偏移一步，面板滑杆同步
  if (Math.hypot(e.clientX - downCX, e.clientY - downCY) < 5) {
    const hitPillow = pickPillow(e.clientX, e.clientY);
    if (hitPillow) {
      hitPillow.userData.floating = !hitPillow.userData.floating;
    } else {
      FX.hue = ((FX.hue + 0.05 + 0.5) % 1) - 0.5;
      applyFX('hue');
      if (sliderEls.hue) {
        sliderEls.hue.inp.value = FX.hue;
        sliderEls.hue.val.textContent = FX.hue.toFixed(2);
      }
    }
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- 尺寸 ----
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
    renderer.setSize(w, h, false);
    rt.setSize(w, h);
    cam.aspect = w / h;
    cam.updateProjectionMatrix();
    bgMat.uniforms.uRes.value.set(w, h);
  }
}
window.addEventListener('resize', resize);
resize();

// ---- 相机同步：与火焰着色器的相机完全一致 ----
const _ro = new THREE.Vector3(), _ww = new THREE.Vector3(), _uu = new THREE.Vector3(),
      _vv = new THREE.Vector3(), _ta = new THREE.Vector3(0, 0.4, 0);
function syncCamera(t, moX) {
  const an = -0.07 * t + 3.0 * moX;
  _ro.set(Math.cos(an) * 4.2, 2.4 + camY, Math.sin(an) * 4.2);
  _ww.copy(_ta).sub(_ro).normalize();
  _uu.set(0, 1, 0).cross(_ww).normalize();
  _vv.copy(_ww).cross(_uu);
  cam.position.copy(_ro);
  cam.up.copy(_vv);
  cam.lookAt(_ro.x + _ww.x, _ro.y + _ww.y, _ro.z + _ww.z);
}

// ---- 参数滑杆面板 ----
const FX_DEFAULTS = {
  alpha: 0.40, churn: 2.0, corridor: 0.04, pocket: 0.40, hue: 0,
  bedSize: 1.0, bedHeight: 0.15, tumbleAmp: 1.0, tumbleSpeed: 1.0, bedSat: 0.45, pillowFloat: 0.55,
  bgBright: 0.95, bgBlue: 1.55, bgFloor: 0.018,
  warmI: 22, coolI: 3.5, bright: 1.25,
};
const FX = { ...FX_DEFAULTS };

function applyFX(key) {
  const v = FX[key];
  switch (key) {
    case 'alpha': flameMat.uniforms.uAlpha.value = v; break;
    case 'churn': flameMat.uniforms.uChurn.value = v; break;
    case 'corridor': flameMat.uniforms.uCorridor.value = v; break;
    case 'pocket': flameMat.uniforms.uPocket.value = v; break;
    case 'hue': flameMat.uniforms.uHueShift.value = v; break;
    case 'bedSize': if (bedWrapRef) bedWrapRef.scale.setScalar(v); break;
    case 'bedSat': applyBedSaturation(v); break;
    case 'bgBright': bgMat.uniforms.uBrightExp.value = v; break;
    case 'bgBlue': bgMat.uniforms.uBlueMul.value = v; break;
    case 'bgFloor': bgMat.uniforms.uBlueAdd.value = v; break;
    case 'bright': flameMat.uniforms.uBright.value = v; break;
    case 'warmI': warm.intensity = v; break;
    case 'coolI': cool.intensity = v; break;
    // bedHeight / tumbleAmp / tumbleSpeed 在 frame() 里实时读取
  }
}

function applyBedSaturation(f) {
  if (!bedPivot) return;
  bedPivot.traverse(o => {
    if (o.isMesh && o.geometry && o.geometry.attributes.color && o.geometry.userData.origColor) {
      const attr = o.geometry.attributes.color;
      const orig = o.geometry.userData.origColor;
      for (let i = 0; i < attr.count; i++) {
        const r = orig[i*3], g = orig[i*3+1], b = orig[i*3+2];
        const lum = 0.3*r + 0.5*g + 0.2*b;
        attr.setXYZ(i, lum + (r-lum)*f, lum + (g-lum)*f, lum + (b-lum)*f);
      }
      attr.needsUpdate = true;
    }
  });
}

const SLIDER_DEFS = [
  ['火焰', null],
  ['alpha', '火焰浓淡', 0.10, 0.80, 0.01],
  ['churn', '翻涌速度', 0.2, 3, 0.05],
  ['corridor', '走廊薄纱', 0, 0.30, 0.01],
  ['pocket', '口袋挖空', 0, 1, 0.01],
  ['hue', '色相偏移', -0.5, 0.5, 0.01],
  ['床', null],
  ['bedSize', '床大小', 0.5, 2.5, 0.05],
  ['bedHeight', '悬浮高度', -0.8, 1.2, 0.05],
  ['bedSat', '床原色饱和', 0, 1, 0.05],
  ['pillowFloat', '漂浮高度', 0.2, 1.2, 0.05],
  ['tumbleAmp', '翻转幅度', 0, 2, 0.05],
  ['tumbleSpeed', '翻转速度', 0, 2, 0.05],
  ['背景', null],
  ['bgBright', '背景亮度', 0.60, 1.80, 0.01],
  ['bgBlue', '背景蓝调', 0.80, 2.00, 0.01],
  ['bgFloor', '深蓝底', 0, 0.30, 0.005],
  ['bright', '画面亮度', 0.60, 2.00, 0.01],
  ['灯光', null],
  ['warmI', '暖光强度', 0, 40, 1],
  ['coolI', '蓝光强度', 0, 6, 0.1],
];

const sliderEls = {};
{
  const panel = document.getElementById('panel');
  for (const def of SLIDER_DEFS) {
    if (def.length === 2) {
      const h = document.createElement('div');
      h.className = 'group';
      h.textContent = def[0];
      panel.appendChild(h);
      continue;
    }
    const [key, label, min, max, step] = def;
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('label');
    lab.textContent = label;
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = min; inp.max = max; inp.step = step; inp.value = FX[key];
    const val = document.createElement('span');
    val.className = 'val'; val.textContent = Number(FX[key]).toFixed(2);
    inp.addEventListener('input', () => {
      FX[key] = parseFloat(inp.value);
      val.textContent = FX[key].toFixed(2);
      applyFX(key);
    });
    row.append(lab, inp, val);
    panel.appendChild(row);
    sliderEls[key] = { inp, val };
  }
  document.getElementById('panelToggle').addEventListener('click', () => {
    panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
  });
  const resetBtn = document.createElement('button');
  resetBtn.id = 'resetBtn';
  resetBtn.textContent = '↺ 恢复默认';
  resetBtn.addEventListener('click', () => {
    Object.assign(FX, FX_DEFAULTS);
    for (const def of SLIDER_DEFS) {
      if (def.length === 2) continue;
      const [key] = def;
      sliderEls[key].inp.value = FX[key];
      sliderEls[key].val.textContent = Number(FX[key]).toFixed(2);
      applyFX(key);
    }
  });
  panel.appendChild(resetBtn);
}

// ---- 主循环 ----
const t0 = performance.now();
let lastHud = 0, frames = 0;

function frame(now) {
  resize();
  const t = (now - t0) / 1000;

  syncCamera(t, viewMoX);

  // 床的不规则翻转：多个不成谐波关系的正弦叠加
  // 床平放模式：四脚着地水平悬浮，仅绕竖轴缓慢旋转 + 轻微摇摆与浮沉（本地修改）
  if (bedPivot) {
    const ts = t * FX.tumbleSpeed;
    bedPivot.rotation.y = ts * 0.12;
    bedPivot.rotation.x = FX.tumbleAmp * 0.10 * Math.sin(ts * 0.171 + 1.2);
    bedPivot.rotation.z = FX.tumbleAmp * 0.06 * Math.sin(ts * 0.117 + 0.5);
    bedPivot.position.y = FX.bedHeight + part * 0.55 + 0.10 * Math.sin(ts * 0.19); // 静止时下沉入火焰，拖拽时升起
  }

  // 枕头漂浮动画：指数平滑趋近目标高度，漂浮时叠加轻微浮动
  for (const p of pillows) {
    p.userData.floatT += ((p.userData.floating ? 1 : 0) - p.userData.floatT) * 0.06;
    const bob = p.userData.floating ? 0.07 * Math.sin(t * 1.8 + p.userData.phase) : 0;
    p.position.y = p.userData.origPos.y + p.userData.floatT * (FX.pillowFloat + bob);
  }

  // 通道一：背景 + 床
  renderer.setRenderTarget(rt);
  renderer.render(sceneBase, cam);

  // 通道二：火焰叠加
  flameMat.uniforms.iResolution.value.set(canvas.width, canvas.height, 1);
  flameMat.uniforms.iTime.value = t;
  flameMat.uniforms.uCamY.value = camY;
  flameMat.uniforms.uMoX.value = viewMoX;
  part += ((dragging ? 1 : 0) - part) * (dragging ? 0.12 : 0.010); // 拨开：快起慢落，散开状态多停留
  flameMat.uniforms.uPart.value = part;
  renderer.setRenderTarget(null);
  renderer.render(flameScene, dummyCam);

  frames++;
  window.__dbg.frames = frames;
  if (now - lastHud > 500) {
    const fps = Math.round(frames * 1000 / (now - lastHud));
    frames = 0; lastHud = now;
    hud.textContent = '澎湃睡觉 · 梦境场景（公开演示版 · 占位火焰）· ' +
      canvas.width + '×' + canvas.height + ' · ' + fps + ' fps · 拖动调整视角（松手保持） · 单击火焰换色相 · 点击枕头漂浮';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__step = frame; // 手动渲染单帧（后台标签页 RAF 可能被节流）
window.__dbg.ready = true; // 模块执行完成标志
window.__dbg.g = () => ({ renderer, sceneBase, cam, rt, flameScene, dummyCam });
window.__dbg.renderStats = () => { const r = renderer.info.render; const progs = (renderer.info.programs||[]).map(p => ({name: p.name, diag: p.diagnostics ? JSON.stringify(p.diagnostics).slice(0,300) : null})); return {calls: r.calls, triangles: r.triangles, progs}; };
window.__dbg.g = () => ({ renderer, sceneBase, cam, rt, flameScene, dummyCam });
window.__dbg.readPixel = (x, y) => {
  const gl = renderer.getContext();
  const dpr = canvas.width / canvas.clientWidth;
  const px = new Uint8Array(4);
  const yGL = canvas.height - Math.round(y * dpr);
  gl.readPixels(Math.round(x * dpr), yGL, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  return Array.from(px);
};
</script>
