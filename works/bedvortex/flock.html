  - uniform: iResolution / iTime, 纹理通道 iChannel0 / iChannel1
  - iChannel0 (nyan.png): filter=nearest, wrap=clamp, vflip=false

<!-- 基于 Shadertoy 原版 mainImage,已改造为"羊群绕圈"版本:
     单精灵采样 → 6 只精灵沿椭圆轨道逆时针奔跑,带跳跃、透视缩放(远小近大)与朝向翻转 -->
<script type="text/plain" id="fragment">
vec4 getSheepFrame( vec2 q, float fr )
{
	// q: 单只羊局部 uv [0,1], 越界透明; fr: 帧序号 0-5
	if( q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0 ) return vec4(0.0);
	vec2 p = q;
	p.y = 0.5 + 1.2*(0.5-p.y);
	p = clamp(p,0.0,1.0);
	p.x = (p.x + fr)*40.0/256.0;
	return texture( iChannel0, p );
}

// 可调参数(JS 侧滑杆每帧写入)
uniform float uSize;      // 羊基础半高
uniform float uCount;     // 羊数量
uniform float uOrbitSpd;  // 公转角速度
uniform float uRunSpd;    // 奔跑帧率
uniform float uHop;       // 跳跃高度
uniform vec2  uOrbit;     // 轨道半径 (x, y)
uniform float uPersp;     // 透视强度 0-1
uniform float uBgScale;   // 背景缩放
uniform float uBgRot;     // 背景旋转速度
uniform float uBgBright;  // 背景亮度
uniform float uBgSat;     // 背景饱和度
uniform float uBgTint;    // 染色强度 0-1
uniform vec3  uPalA;      // 调色板① (纵向=顶部 / 径向=中心)
uniform vec3  uPalB;      // 调色板②
uniform vec3  uPalC;      // 调色板③
uniform vec3  uPalD;      // 调色板④ (纵向=底部 / 径向=外缘)
uniform float uPalMode;   // 映射方式: 0=纵向渐变 1=径向圈层
uniform float uWarpAmt;   // 背景扭曲幅度
uniform float uWarpSpd;   // 背景扭曲速度倍率
uniform float uWarpFreq;  // 背景扭曲径向频率

vec4 getFlockColor( vec2 pos, float time )
{
	float aspect = iResolution.x / iResolution.y;
	vec4 acc = vec4(0.0);
	// 两遍绘制: 先画远侧(sin>0, 屏幕上方), 再画近侧, 遮挡才正确
	for( int pass = 0; pass < 2; pass++ )
	for( int i = 0; i < 12; i++ )
	{
		float fi = float(i);
		if( fi >= uCount ) continue;
		float ang = fi*6.2831853/uCount + time*uOrbitSpd;   // 均布, 逆时针公转
		float sn = sin(ang);
		if( pass == 0 && sn <= 0.0 ) continue;
		if( pass == 1 && sn > 0.0 ) continue;
		float depth = 0.5 - 0.5*sn;            // 屏幕下方为近(1), 上方为远(0)
		float scale = mix( 1.0 - 0.45*uPersp, 1.0, depth ); // 透视: 远小近大
		vec2 c = vec2( 0.5 + uOrbit.x*cos(ang), 0.5 + uOrbit.y*sn );
		c.y += uHop*scale*abs( sin(6.0*time + fi*1.7) );    // 跳跃
		float hh = uSize*scale;
		vec2 half2 = vec2( hh*1.25/aspect, hh );
		vec2 q = (pos - c)/half2 + 0.5;
		if( -sn > 0.0 ) q.x = 1.0 - q.x;       // 向右跑时水平镜像(精灵默认朝左)
		float fr = mod( floor(mod(uRunSpd*time,6.0)) + fi, 6.0 );  // 跑步帧错开
		vec4 s = getSheepFrame( q, fr );
		acc.rgb = s.rgb*s.a + acc.rgb*(1.0-s.a);
		acc.a = s.a + acc.a*(1.0-s.a);
	}
	return acc;
}

void mainImage( out vec4 fragColor, in vec2 fragCoord )
{
	float time = iTime;
	float alpha = 1.;
	
	vec2 pos = fragCoord.xy / vec2(iResolution.xy);
	pos -= .5;
	pos *= 1.3;
	pos += .5;
	
	vec2 dx = pos - .5;
	float r = dot(dx,dx);
	float phase = time * 5. + r * 15.;
	
	vec3 lerps;
	lerps.r = cos(phase) * .5 + .5;
	lerps.g = cos(phase - 2.0943951023932) * .5 + .5;
	lerps.b = cos(phase - 4.1887902047864) * .5 + .5;
	
	lerps.rgb *= alpha;
	lerps.r += 1. - alpha;
	
	vec2 lookup = pos;
	lookup.x += (2. * lerps.g - 1.) * .05 * alpha;
	lookup.y -= (2. * lerps.b - 1.) * .05 * alpha;

	// 背景独立扭曲(默认参数下与羊群扰动一致)
	float wphase = time * 5. * uWarpSpd + r * uWarpFreq;
	vec3 wlerps;
	wlerps.r = cos(wphase) * .5 + .5;
	wlerps.g = cos(wphase - 2.0943951023932) * .5 + .5;
	wlerps.b = cos(wphase - 4.1887902047864) * .5 + .5;
	vec2 bwarp = pos;
	bwarp.x += (2. * wlerps.g - 1.) * uWarpAmt * alpha;
	bwarp.y -= (2. * wlerps.b - 1.) * uWarpAmt * alpha;

	vec4 nyanColor = getFlockColor(lookup, time);
	// 背景: 扭曲 + 缩放 + 旋转 + 亮度/饱和度(不影响羊)
	vec2 buv = (bwarp - 0.5) * uBgScale;
	float ba = uBgRot * time;
	buv = mat2( cos(ba), -sin(ba), sin(ba), cos(ba) ) * buv + 0.5;
	vec4 bgColor = texture( iChannel1, buv );
	float bLum = dot( bgColor.rgb, vec3(0.299,0.587,0.114) );
	bgColor.rgb = mix( vec3(bLum), bgColor.rgb, uBgSat ) * uBgBright;
	// 染色: 四色渐变调色板(每色独立可选), 纵向渐变或径向圈层, 保留明暗结构
	float asp = iResolution.x / iResolution.y;
	float palT = mix( 1.0 - pos.y, clamp( length( (pos - 0.5) * vec2(asp, 1.0) ) * 1.7, 0.0, 1.0 ), uPalMode );
	vec3 tintCol = mix( uPalA, uPalB, smoothstep(0.0, 0.3333, palT) );
	tintCol = mix( tintCol, uPalC, smoothstep(0.3333, 0.6667, palT) );
	tintCol = mix( tintCol, uPalD, smoothstep(0.6667, 1.0, palT) );
	bgColor.rgb = mix( bgColor.rgb, bLum * 2.0 * tintCol, uBgTint );
	vec4 color;
	color.rgb = nyanColor.rgb * nyanColor.a + (1. - nyanColor.a) * bgColor.rgb;
	color.a = bgColor.a;
	
	fragColor.r = .75 * dot(color.rgb, lerps.rgb);
	fragColor.g = .75 * dot(color.rgb, lerps.brg);
	fragColor.b = .75 * dot(color.rgb, lerps.gbr);
	fragColor.a = color.a;
}
</script>

<script>
"use strict";

const canvas = document.getElementById("glcanvas");
const errBox = document.getElementById("err");
window.__shaderOk = false;

function fatal(msg) {
  errBox.style.display = "block";
  errBox.textContent = msg;
  const loading = document.getElementById("loading");
  loading.classList.add("hidden");
}

// ---------- WebGL 上下文 ----------
let gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: true });
let isGL2 = !!gl;
if (!gl) gl = canvas.getContext("webgl", { antialias: false, alpha: false, preserveDrawingBuffer: true });
if (!gl) { fatal("当前浏览器不支持 WebGL"); throw new Error("no webgl"); }

// ---------- 着色器 ----------
const version = isGL2 ? "#version 300 es\n" : "";
const VERT = version + (isGL2 ? "in vec2 aPos;\n" : "attribute vec2 aPos;\n") + `
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const userCode = document.getElementById("fragment").textContent;

// WebGL1 下用宏把 texture() 映射到 texture2D()
const compat = isGL2 ? "" : "#define texture texture2D\n";
const outDecl = isGL2 ? "out vec4 shadertoy_out;\n" : "";
const epilogue = isGL2
  ? "void main() { vec4 fragColor; mainImage(fragColor, gl_FragCoord.xy); shadertoy_out = fragColor; }"
  : "void main() { vec4 fragColor; mainImage(fragColor, gl_FragCoord.xy); gl_FragColor = fragColor; }";

const FRAG = version + `
precision highp float;
uniform vec3  iResolution;
uniform float iTime;
uniform sampler2D iChannel0;
uniform sampler2D iChannel1;
` + compat + outDecl + `
` + userCode + `
` + epilogue + "\n";

function compile(type, src, label) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const info = gl.getShaderInfoLog(sh);
    fatal(label + " 编译失败:\n" + info);
    throw new Error(label + ": " + info);
  }
  return sh;
}

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT, "顶点着色器"));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG, "片元着色器"));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
  fatal("程序链接失败:\n" + gl.getProgramInfoLog(prog));
  throw new Error("link failed");
}
gl.useProgram(prog);

// 全屏大三角形
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

// ---------- 纹理(采样参数与 Shadertoy 引擎一致: 上传不翻转) ----------
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("无法加载 " + src));
    img.src = src;
  });
}

function makeTexture(img, { filter, wrap }) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  if (filter === "nearest") {
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  } else { // mipmap
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.generateMipmap(gl.TEXTURE_2D);
  }
  const glWrap = wrap === "repeat" ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, glWrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, glWrap);
  return tex;
}

let tex0, tex1;
let bgImage = null; // 原版漩涡贴图, 供"漩涡"预设切换回去
// 精灵图:默认小羊(sheep.png),加 ?sprite=cat 切回原版小猫(nyan.png)
const SPRITE = new URLSearchParams(location.search).get("sprite") === "cat" ? "nyan.png" : "sheep.png";
(async () => {
  try {
    const [img0, img1] = await Promise.all([loadImage(SPRITE + "?v=2"), loadImage("bg.jpg")]);
    bgImage = img1;
    gl.activeTexture(gl.TEXTURE0);
    tex0 = makeTexture(img0, { filter: "nearest", wrap: "clamp" });   // iChannel0
    gl.activeTexture(gl.TEXTURE1);
    tex1 = makeTexture(img1, { filter: "mipmap", wrap: "repeat" });   // iChannel1
    gl.uniform1i(gl.getUniformLocation(prog, "iChannel0"), 0);
    gl.uniform1i(gl.getUniformLocation(prog, "iChannel1"), 1);
    window.__shaderOk = true;
    document.getElementById("loading").classList.add("hidden");
  } catch (e) {
    fatal(e.message);
  }
})();

// ---------- 背景图片更换 ----------
function setBgTexture(source) {
  if (!tex1 || !source) return;
  // 统一画到 512×512 画布(cover 裁切), 保证 2 的幂尺寸, 两代 WebGL 均可平铺/生成 mipmap
  const c = document.createElement("canvas");
  c.width = 512; c.height = 512;
  const ctx = c.getContext("2d");
  const w = source.naturalWidth || source.width, h = source.naturalHeight || source.height;
  const s = Math.max(512 / w, 512 / h);
  ctx.drawImage(source, (512 - w * s) / 2, (512 - h * s) / 2, w * s, h * s);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, tex1);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
}
window.__setBg = setBgTexture; // 供自动化测试

function presetCanvas(draw) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 512;
  draw(c.getContext("2d"));
  return c;
}
const BG_PRESETS = {
  "漩涡": () => bgImage,
  "纯色": () => presetCanvas((g) => { g.fillStyle = "#23232a"; g.fillRect(0, 0, 512, 512); }),
  "彩虹": () => presetCanvas((g) => {
    const gr = g.createLinearGradient(0, 0, 512, 512);
    for (let i = 0; i <= 6; i++) gr.addColorStop(i / 6, "hsl(" + Math.round(i * 60) + ",80%,55%)");
    g.fillStyle = gr; g.fillRect(0, 0, 512, 512);
  }),
  "网格": () => presetCanvas((g) => {
    g.fillStyle = "#101014"; g.fillRect(0, 0, 512, 512);
    g.strokeStyle = "rgba(255,255,255,.5)"; g.lineWidth = 2;
    for (let i = 0; i <= 512; i += 64) {
      g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 512); g.stroke();
      g.beginPath(); g.moveTo(0, i); g.lineTo(512, i); g.stroke();
    }
  }),
  "星空": () => presetCanvas((g) => {
    g.fillStyle = "#0a0a12"; g.fillRect(0, 0, 512, 512);
    let seed = 42;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 260; i++) {
      const x = rnd() * 512, y = rnd() * 512, r = rnd() * 1.6 + 0.4;
      const b = Math.round(120 + rnd() * 135);
      g.fillStyle = "rgba(" + b + "," + b + "," + (b + 20) + "," + (0.4 + rnd() * 0.6).toFixed(2) + ")";
      g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    }
  }),
};

// 上传 / 拖拽图片作为背景
function useImageFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = () => { setBgTexture(img); URL.revokeObjectURL(url); };
  img.src = url;
}
document.getElementById("bgFile").addEventListener("change", (e) => useImageFile(e.target.files && e.target.files[0]));
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); useImageFile(e.dataTransfer.files && e.dataTransfer.files[0]); });

// ---------- 渲染循环 ----------
const uResolution = gl.getUniformLocation(prog, "iResolution");
const uTime = gl.getUniformLocation(prog, "iTime");

// ---------- 羊群参数与滑杆 ----------
const U = {
  size: gl.getUniformLocation(prog, "uSize"),
  count: gl.getUniformLocation(prog, "uCount"),
  orbitSpd: gl.getUniformLocation(prog, "uOrbitSpd"),
  runSpd: gl.getUniformLocation(prog, "uRunSpd"),
  hop: gl.getUniformLocation(prog, "uHop"),
  orbit: gl.getUniformLocation(prog, "uOrbit"),
  persp: gl.getUniformLocation(prog, "uPersp"),
  bgScale: gl.getUniformLocation(prog, "uBgScale"),
  bgRot: gl.getUniformLocation(prog, "uBgRot"),
  bgBright: gl.getUniformLocation(prog, "uBgBright"),
  bgSat: gl.getUniformLocation(prog, "uBgSat"),
  palA: gl.getUniformLocation(prog, "uPalA"),
  palB: gl.getUniformLocation(prog, "uPalB"),
  palC: gl.getUniformLocation(prog, "uPalC"),
  palD: gl.getUniformLocation(prog, "uPalD"),
  palMode: gl.getUniformLocation(prog, "uPalMode"),
  bgTint: gl.getUniformLocation(prog, "uBgTint"),
  warpAmt: gl.getUniformLocation(prog, "uWarpAmt"),
  warpSpd: gl.getUniformLocation(prog, "uWarpSpd"),
  warpFreq: gl.getUniformLocation(prog, "uWarpFreq"),
};

const DEFAULTS = {
  count: 6, size: 0.15, orbitSpd: 0.7, runSpd: 20, hop: 0.04, orbitX: 0.27, orbitY: 0.21, persp: 1,
  bgScale: 1, bgRot: 0, bgBright: 1, bgSat: 1,
  palA: "#4a63e8", palB: "#7a52e8", palC: "#b04be8", palD: "#e84bc0",  // 蓝→靛→紫→品红(参考图配色)
  palMode: 0, bgTint: 0.85,
  warpAmt: 0.05, warpSpd: 1, warpFreq: 15,
};
const params = { ...DEFAULTS };
try { Object.assign(params, JSON.parse(localStorage.getItem("flockParams") || "{}")); } catch (e) { /* 忽略损坏的存档 */ }

function applyParams() {
  gl.uniform1f(U.size, params.size);
  gl.uniform1f(U.count, params.count);
  gl.uniform1f(U.orbitSpd, params.orbitSpd);
  gl.uniform1f(U.runSpd, params.runSpd);
  gl.uniform1f(U.hop, params.hop);
  gl.uniform2f(U.orbit, params.orbitX, params.orbitY);
  gl.uniform1f(U.persp, params.persp);
  gl.uniform1f(U.bgScale, params.bgScale);
  gl.uniform1f(U.bgRot, params.bgRot);
  gl.uniform1f(U.bgBright, params.bgBright);
  gl.uniform1f(U.bgSat, params.bgSat);
  const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
  gl.uniform3f(U.palA, ...hex2rgb(params.palA));
  gl.uniform3f(U.palB, ...hex2rgb(params.palB));
  gl.uniform3f(U.palC, ...hex2rgb(params.palC));
  gl.uniform3f(U.palD, ...hex2rgb(params.palD));
  gl.uniform1f(U.palMode, params.palMode);
  gl.uniform1f(U.bgTint, params.bgTint);
  gl.uniform1f(U.warpAmt, params.warpAmt);
  gl.uniform1f(U.warpSpd, params.warpSpd);
  gl.uniform1f(U.warpFreq, params.warpFreq);
}

const SLIDERS = [
  { key: "count",    label: "羊数量",  min: 1,    max: 12,   step: 1,     fmt: (v) => v + " 只" },
  { key: "size",     label: "羊大小",  min: 0.05, max: 0.30, step: 0.005, fmt: (v) => (+v).toFixed(3) },
  { key: "orbitSpd", label: "公转速度", min: 0,    max: 2,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { key: "runSpd",   label: "奔跑速度", min: 0,    max: 40,   step: 0.5,   fmt: (v) => (+v).toFixed(1) },
  { key: "hop",      label: "跳跃高度", min: 0,    max: 0.12, step: 0.002, fmt: (v) => (+v).toFixed(3) },
  { key: "orbitX",   label: "轨道宽度", min: 0.05, max: 0.36, step: 0.01,  fmt: (v) => (+v).toFixed(2) },
  { key: "orbitY",   label: "轨道高度", min: 0.04, max: 0.30, step: 0.01,  fmt: (v) => (+v).toFixed(2) },
  { key: "persp",    label: "透视强度", min: 0,    max: 1,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { group: "背景" },
  { key: "bgTint",   label: "染色强度", min: 0,    max: 1,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { key: "bgScale",  label: "背景缩放", min: 0.4,  max: 3,    step: 0.05,  fmt: (v) => (+v).toFixed(2) + "x" },
  { key: "bgRot",    label: "背景旋转", min: -1,   max: 1,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { key: "bgBright", label: "背景亮度", min: 0,    max: 2,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { key: "bgSat",    label: "背景饱和度", min: 0,   max: 2,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { group: "扭曲" },
  { key: "warpAmt",  label: "扭曲强度", min: 0,    max: 0.25, step: 0.005, fmt: (v) => (+v).toFixed(3) },
  { key: "warpSpd",  label: "扭曲速度", min: 0,    max: 3,    step: 0.05,  fmt: (v) => (+v).toFixed(2) },
  { key: "warpFreq", label: "扭曲频率", min: 0,    max: 40,   step: 1,     fmt: (v) => (+v).toFixed(0) },
];

function saveParams() {
  try { localStorage.setItem("flockParams", JSON.stringify(params)); } catch (e) { /* 隐私模式忽略 */ }
}

const panelBody = document.getElementById("panelBody");
const sliderEls = {};
for (const s of SLIDERS) {
  if (s.group) {
    const h = document.createElement("div");
    h.className = "group";
    h.textContent = s.group;
    panelBody.appendChild(h);
    if (s.group === "背景") {
      // 背景图片选择: 内置预设 + 上传
      const imgs = document.createElement("div");
      imgs.className = "imgs";
      for (const [name, gen] of Object.entries(BG_PRESETS)) {
        const b = document.createElement("button");
        b.className = "bgbtn" + (name === "漩涡" ? " on" : "");
        b.textContent = name;
        b.addEventListener("click", () => {
          setBgTexture(gen());
          document.querySelectorAll(".bgbtn").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
        });
        imgs.appendChild(b);
      }
      const up = document.createElement("button");
      up.className = "bgbtn";
      up.textContent = "上传…";
      up.addEventListener("click", () => document.getElementById("bgFile").click());
      imgs.appendChild(up);
      panelBody.appendChild(imgs);

      // 四色调色板: 每色一个独立取色器(系统取色器含完整色环), 纵向/径向两种映射
      const palWrap = document.createElement("div");
      palWrap.className = "palwrap";
      const modeRow = document.createElement("div");
      modeRow.className = "imgs";
      const modeBtns = {};
      for (const [mode, name] of [[0, "纵向渐变"], [1, "径向圈层"]]) {
        const mb = document.createElement("button");
        mb.className = "bgbtn" + (params.palMode === mode ? " on" : "");
        mb.textContent = name;
        mb.addEventListener("click", () => {
          params.palMode = mode;
          Object.values(modeBtns).forEach((x) => x.classList.remove("on"));
          mb.classList.add("on");
          saveParams();
        });
        modeBtns[mode] = mb;
        modeRow.appendChild(mb);
      }
      const palRow = document.createElement("div");
      palRow.className = "palrow";
      const palInputs = {};
      for (const k of ["palA", "palB", "palC", "palD"]) {
        const inp = document.createElement("input");
        inp.type = "color";
        inp.value = params[k];
        inp.title = k;
        inp.addEventListener("input", () => { params[k] = inp.value; saveParams(); });
        palInputs[k] = inp;
        palRow.appendChild(inp);
      }
      const hint = document.createElement("div");
      hint.className = "palhint";
      hint.textContent = "① 顶部/中心 → ④ 底部/外缘";
      palWrap.appendChild(modeRow);
      palWrap.appendChild(palRow);
      palWrap.appendChild(hint);
      panelBody.appendChild(palWrap);
      sliderEls.__pal = {
        inputs: palInputs,
        sync: () => {
          for (const k of ["palA", "palB", "palC", "palD"]) palInputs[k].value = params[k];
          Object.entries(modeBtns).forEach(([m, b]) => b.classList.toggle("on", params.palMode === +m));
        },
      };
    }
    continue;
  }
  const row = document.createElement("div");
  row.className = "row";
  row.innerHTML =
    '<div class="lab"><span>' + s.label + '</span><span class="val"></span></div>' +
    '<input type="range" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '">';
  const input = row.querySelector("input");
  const val = row.querySelector(".val");
  input.value = params[s.key];
  val.textContent = s.fmt(params[s.key]);
  input.addEventListener("input", () => {
    params[s.key] = +input.value;
    val.textContent = s.fmt(params[s.key]);
    try { localStorage.setItem("flockParams", JSON.stringify(params)); } catch (e) { /* 隐私模式忽略 */ }
  });
  sliderEls[s.key] = { input, val, fmt: s.fmt };
  panelBody.appendChild(row);
}

document.getElementById("panelReset").addEventListener("click", () => {
  Object.assign(params, DEFAULTS);
  for (const s of SLIDERS) {
    if (!s.key) continue;
    sliderEls[s.key].input.value = params[s.key];
    sliderEls[s.key].val.textContent = s.fmt(params[s.key]);
  }
  sliderEls.__pal.sync();
  saveParams();
});

const panel = document.getElementById("panel");
document.getElementById("panelToggle").addEventListener("click", () => panel.classList.toggle("hidden"));

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.floor(canvas.clientWidth * dpr);
  const h = Math.floor(canvas.clientHeight * dpr);
  if (w > 0 && h > 0 && (canvas.width !== w || canvas.height !== h)) {
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}
window.addEventListener("resize", resize);

// 手动渲染一帧(测试/隐藏标签页时 rAF 停摆仍可出图)
window.__render = function (t) {
  if (!window.__shaderOk) return false;
  resize();
  if (canvas.width === 0 || canvas.height === 0) return false;
  gl.uniform3f(uResolution, canvas.width, canvas.height, 1);
  gl.uniform1f(uTime, t);
  applyParams();
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return true;
};

let paused = false, t0 = performance.now(), tPause = 0, elapsed = 0;
let frames = 0, fpsT = performance.now();
const fpsEl = document.getElementById("fps");

function frame(now) {
  if (!paused) elapsed = (now - t0) / 1000;
  if (window.__shaderOk) {
    resize();
    gl.uniform3f(uResolution, canvas.width, canvas.height, 1);
    gl.uniform1f(uTime, elapsed);
    applyParams();
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  frames++;
  if (now - fpsT >= 500) {
    fpsEl.textContent = Math.round(frames * 1000 / (now - fpsT)) + " fps" + (paused ? " (已暂停)" : "");
    frames = 0; fpsT = now;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 交互 ----------
function reset() { t0 = performance.now(); elapsed = 0; }
function togglePause() {
  if (!paused) { paused = true; }
  else { t0 = performance.now() - elapsed * 1000; paused = false; }
}
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  else if (e.code === "KeyR") reset();
  else if (e.code === "KeyF") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }
});
</script>
</body>
